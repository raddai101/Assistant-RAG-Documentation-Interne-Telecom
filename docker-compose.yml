services:

  # ============================================================
  # PostgreSQL
  # ============================================================
  postgres:
    image: postgres:16
    container_name: tekis-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    volumes:
      - postgres_data:/var/lib/postgresql/data

    ports:
      - "5432:5432"

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"
        ]
      interval: 5s
      timeout: 5s
      retries: 20

    networks:
      - tekis-network


  # ============================================================
  # Ollama
  # ============================================================
  ollama:
    image: ollama/ollama:latest
    container_name: tekis-ollama
    restart: unless-stopped

    ports:
      - "11434:11434"

    volumes:
      - ollama_data:/root/.ollama

    environment:
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility

    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities:
                - gpu

    networks:
      - tekis-network


  # ============================================================
  # Neo4j
  # ============================================================
  neo4j:
    image: neo4j:5
    container_name: tekis-neo4j
    restart: unless-stopped

    environment:
      NEO4J_AUTH: ${NEO4J_USER}/${NEO4J_PASSWORD}

    ports:
      - "7474:7474"
      - "7687:7687"

    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
      - neo4j_import:/var/lib/neo4j/import
      - neo4j_plugins:/plugins

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget --no-verbose --tries=1 --spider http://localhost:7474 || exit 1"
        ]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s

    networks:
      - tekis-network


  # ============================================================
  # Backend
  # ============================================================
  backend:
    build:
      context: ./tekis-backend
      dockerfile: Dockerfile

    container_name: tekis-backend
    restart: unless-stopped

    env_file:
      - .env

    environment:
      FLASK_ENV: production

      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}

      OLLAMA_BASE_URL: http://ollama:11434

      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: ${NEO4J_USER}
      NEO4J_PASSWORD: ${NEO4J_PASSWORD}

      CHROMA_PERSIST_DIR: /app/data/chroma
      INGESTION_STORAGE_DIR: /app/data/documents
      QUARANTINE_DIR: /app/data/quarantine

    volumes:
      - chroma_data:/app/data/chroma
      - documents_data:/app/data/documents
      - quarantine_data:/app/data/quarantine

      - ./corpus/enterprise:/app/corpus/enterprise:ro
      - ./corpus/evaluate:/app/corpus/evaluate:ro

    expose:
      - "5000"

    ports:
      - "5000:5000"

    depends_on:
      postgres:
        condition: service_healthy

      ollama:
        condition: service_started

      neo4j:
        condition: service_healthy

    networks:
      - tekis-network


  # ============================================================
  # Frontend
  # ============================================================
  frontend:
    build:
      context: ./tekis-frontend
      dockerfile: Dockerfile

    container_name: tekis-frontend
    restart: unless-stopped

    ports:
      - "5500:80"

    depends_on:
      - backend

    networks:
      - tekis-network


# ==============================================================
# Persistent volumes
# ==============================================================
volumes:

  postgres_data:
    name: tekis-postgres-data

  ollama_data:
    name: tekis-ollama-data

  chroma_data:
    name: tekis-chroma-data

  documents_data:
    name: tekis-documents-data

  quarantine_data:
    name: tekis-quarantine-data

  neo4j_data:
    name: tekis-neo4j-data

  neo4j_logs:
    name: tekis-neo4j-logs

  neo4j_import:
    name: tekis-neo4j-import

  neo4j_plugins:
    name: tekis-neo4j-plugins


# ==============================================================
# Network
# ==============================================================
networks:

  tekis-network:
    name: tekis-network
    driver: bridge

